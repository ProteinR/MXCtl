name: MXCtl
options:
  bundleIdPrefix: com.dmemruk
  developmentLanguage: ru
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.22"
    CURRENT_PROJECT_VERSION: "23"
    # No Apple Developer account: ad-hoc signing, no hardened runtime (scripts/install.sh re-signs
    # with the local certificate so Accessibility and Input Monitoring survive rebuilds).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  MXCtl:
    type: application
    platform: macOS
    sources:
      - path: MXCtl
        excludes:
          - "Resources/Devices/**"
      # Device pictures (scripts/make-device-art.py), copied as a folder.
      - path: MXCtl/Resources/Devices
        type: folder
        buildPhase: resources
    info:
      path: MXCtl/Info.plist
      properties:
        CFBundleDisplayName: MXCtl
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # Menu bar only, no Dock icon.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MXCtl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MXCtlTests
  # Unit tests of the pure logic: HID++ packets, gestures, smooth scrolling, config.
  MXCtlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MXCtlTests
    dependencies:
      - target: MXCtl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmemruk.MXCtlTests
        GENERATE_INFOPLIST_FILE: YES
